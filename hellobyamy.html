<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 新年祝福</title>
<style>
  /* --- 1. 全局設定 --- */
  body, html {
    margin: 0;
    padding: 0;
    font-family: "Didot", "Times New Roman", "Microsoft JhengHei", serif;
    height: 100%;
    overflow: hidden;
    background-color: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- 2. 煙火畫布 (最上層) --- */
  #fireworks-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* 讓點擊穿透 */
    z-index: 999; /* 煙火在最上層 */
  }

  /* --- 3. 封面區塊 (Cover) --- */
  #cover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1f1f1f 0%, #000000 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
  }

  #cover.hidden {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  /* 封面按鈕 */
  .gold-badge-container {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 40px;
    cursor: pointer;
    filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
  }

  .ripple {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 50%;
    animation: ripple-anim 2s infinite ease-out;
    opacity: 0;
  }
  .ripple:nth-child(2) { animation-delay: 0.6s; }

  .gold-badge {
    width: 110px;
    height: 110px;
    background: #000;
    border: 2px solid #d4af37;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #d4af37;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 1px;
    z-index: 2;
    transition: all 0.2s;
    font-family: "Didot", serif;
    position: relative;
  }

  .gold-badge::after {
    content: '';
    position: absolute;
    width: 100px;
    height: 100px;
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 50%;
  }

  .gold-badge-container:hover .gold-badge {
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
    background: #111;
  }
  .gold-badge-container:active .gold-badge {
    transform: scale(0.9);
  }

  .cover-text {
    color: #888;
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: sans-serif;
    margin-top: 15px;
  }

  .tap-hint {
    margin-top: 10px;
    font-size: 0.7rem;
    color: #d4af37;
    opacity: 0.8;
    letter-spacing: 2px;
    animation: fade 2s infinite;
  }

  /* --- 4. 卡片本體 (Card) --- */
  #card-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 50;
  }

  .card {
    background: #fff;
    background: linear-gradient(135deg, #fffcf5 0%, #ffffff 100%);
    width: 85%;
    max-width: 480px;
    padding: 50px 35px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    opacity: 0;
    transform: scale(0.9) translateY(20px);
    transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    text-align: center;
  }

  .card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
    animation: floating 6s ease-in-out infinite; 
  }

  .card::before {
    content: '';
    position: absolute;
    top: 15px; left: 15px; right: 15px; bottom: 15px;
    border: 1px solid #d4af37;
    pointer-events: none;
  }

  .card h2 {
    font-family: "Didot", serif;
    color: #111;
    font-size: 2rem;
    margin: 10px 0 10px 0;
    letter-spacing: 1px;
    position: relative; z-index: 2;
  }
  
  .card .subtitle {
    display: block;
    color: #d4af37;
    font-size: 0.85rem;
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-transform: uppercase;
    font-family: sans-serif;
    position: relative; display: inline-block; z-index: 2;
  }
  
  .card .subtitle::before, .card .subtitle::after {
    content: ''; display: inline-block; width: 20px; height: 1px;
    background: #d4af37; vertical-align: middle; margin: 0 10px; opacity: 0.5;
  }

  .card-content {
    text-align: left; color: #444; line-height: 1.9; font-size: 0.95rem;
    font-family: "Microsoft JhengHei", sans-serif; padding: 0 5px;
    position: relative; z-index: 2;
  }

  .highlight-name {
    color: #000; font-weight: bold;
    background: linear-gradient(transparent 70%, rgba(212, 175, 55, 0.2) 70%); 
  }

  .signature {
    margin-top: 40px; text-align: right;
    font-family: "Microsoft JhengHei", sans-serif; padding-right: 5px;
    position: relative; z-index: 2;
  }
  
  .signature strong { display: block; font-size: 1.1rem; color: #000; }
  .signature span { font-size: 0.8rem; color: #888; }

  @keyframes ripple-anim {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes fade {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  @keyframes floating {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }
</style>
</head>
<body>

  <canvas id="fireworks-canvas"></canvas>

  <div id="cover">
    <div class="gold-badge-container" id="trigger-btn" onclick="triggerFireworks(event)">
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="gold-badge">2026</div>
    </div>
    
    <div class="cover-text">New Year Invitation</div>
    <div class="tap-hint">Tap to Celebrate</div>
  </div>

  <div id="card-container">
    <div class="card" id="message-card">
      <h2>Happy New Year</h2>
      <!-- 副標題改為緣分相關 -->
      <span class="subtitle">很高興能與您相識</span>

      <div class="card-content">
        <p>親愛的 <span id="client-name" class="highlight-name">未來夥伴</span> 您好：</p>

        <p>
          雖然我們還沒有正式合作，但在過去的交流中，我很欣賞您的品牌理念，也很高興能認識您。
        </p>
        <p>
          新的一年，如果您有任何 SEO 或行銷上的需求，<strong>瑪卡鎷網路行銷</strong> 隨時準備好成為您最強的後盾。
        </p>
        <p>
          就像這張卡片的煙火一樣，祝願貴公司在 2026 年<strong>能見度大增、業績一飛沖天</strong>！
        </p>
        <p>
          期待與您並肩作戰！
        </p>
      </div>

      <div class="signature">
        <!-- 署名改為公司名稱 -->
        <strong>Amy</strong>
        <span>期待與您的合作</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. 自動抓名字邏輯 ---
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get('name');
      if (name) {
        document.getElementById('client-name').textContent = name;
        document.title = `給 ${name} 的 2026 祝福`;
      }
      resizeCanvas();
    };

    // --- 2. 煙火系統 (保持原本的快節奏版) ---
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor(x, y, color, velocity, isSparkle) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2 + 1;
        this.velocity = velocity;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015; 
        this.gravity = 0.05;
        this.isSparkle = isSparkle;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= 0.98;
        this.velocity.y *= 0.98;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;

        if(this.isSparkle && Math.random() > 0.8) {
            this.alpha = Math.min(this.alpha + 0.2, 1);
        }
      }
    }

    function triggerFireworks(e) {
      const cover = document.getElementById('cover');
      const card = document.getElementById('message-card');
      const btn = document.getElementById('trigger-btn');
      
      const rect = btn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      createExplosion(centerX, centerY, 120);

      cover.classList.add('hidden');

      setTimeout(() => {
        card.classList.add('show');
        
        let count = 0;
        const interval = setInterval(() => {
          const randomX = Math.random() * window.innerWidth;
          const randomY = Math.random() * (window.innerHeight * 0.5);
          createExplosion(randomX, randomY, 40);
          count++;
          if (count > 2) clearInterval(interval); 
        }, 300);
        
      }, 100);

      animate();
    }

    function createExplosion(x, y, particleCount) {
      const colors = ['#d4af37', '#ffd700', '#ffffff', '#ffec8b', '#ffa500'];
      
      for (let i = 0; i < particleCount; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 20 + 5; 
        const velocity = {
          x: Math.cos(angle) * speed,
          y: Math.sin(angle) * speed
        };
        particles.push(new Particle(x, y, color, velocity, Math.random() > 0.8));
      }
    }

    function animate() {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.globalCompositeOperation = 'source-over';

      particles.forEach((p, index) => {
        if (p.alpha > 0) {
          p.draw();
          p.update();
        } else {
          particles.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
