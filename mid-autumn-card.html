<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>中秋佳節・花好月圓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    /* 配合寫實夜空，調整為更深邃的夜色 */
    --moonlight-silver:#E8E3F0;
    --deep-purple:#110A1F;
    --gold:#F5D67B;
    --osmanthus:#F2B84B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--deep-purple);
    font-family:"Noto Serif TC", serif;
    color:var(--moonlight-silver);
  }
  #scene{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    /* 寫實星空漸層底色 */
    background:
      radial-gradient(ellipse 100% 80% at 50% 30%, #2A1B45 0%, #150B26 60%, #080312 100%);
  }

  /* ---------- 星空 ---------- */
  .star{
    position:absolute;
    width:2px; height:2px;
    background:var(--moonlight-silver);
    border-radius:50%;
    opacity:.3;
    animation:twinkle 4s ease-in-out infinite;
    box-shadow: 0 0 4px rgba(255,255,255,0.8);
  }
  @keyframes twinkle{
    0%,100%{opacity:.1; transform:scale(0.8);}
    50%{opacity:.9; transform:scale(1.5);}
  }

  /* ---------- 標題 ---------- */
  .header{
    position:absolute; top:0; left:0; right:0;
    padding:calc(28px + env(safe-area-inset-top,0px)) 24px 0;
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .header .eyebrow{
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.3em;
    color:var(--gold);
    opacity:.85;
    margin:0 0 6px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .header h1{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:.15em;
    color:#FFF;
    text-shadow:0 0 20px rgba(245,214,123,.4), 0 4px 10px rgba(0,0,0,0.6);
  }

  /* ---------- 月亮與雲層舞台 ---------- */
  .moon-stage{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(75vw, 380px); /* 放大舞台以容納立體雲層 */
    aspect-ratio:1/1;
    z-index:3;
  }
  canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  #moonCanvas{ cursor:pointer; }
  #cloudCanvas{ touch-action:none; z-index:2; cursor: grab; }
  #cloudCanvas:active{ cursor: grabbing; }

  /* ---------- 桂花 ---------- */
  #petalLayer{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:4;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    width:7px; height:7px;
    background:var(--osmanthus);
    border-radius:2px 8px 2px 8px;
    opacity:.85;
    box-shadow:0 0 6px rgba(242,184,75,.8);
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(-5vh) translateX(0) rotate(0deg); }
    100%{ transform:translateY(110vh) translateX(var(--drift, 50px)) rotate(320deg); }
  }

  /* ---------- 提示文字 ---------- */
  .hint{
    position:absolute;
    left:0; right:0;
    bottom:calc(12% + env(safe-area-inset-bottom,0px));
    text-align:center;
    z-index:6;
    font-family:"Cormorant Garamond", serif;
    font-size:15px;
    letter-spacing:.1em;
    color:rgba(255,255,255,0.8);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    transition:opacity .6s ease;
    pointer-events:none;
  }
  .hint.hide{ opacity:0; }

  /* ---------- 祝福卡 ---------- */
  #blessing{
    position:absolute;
    left:0; right:0;
    bottom:0;
    padding:40px 28px calc(40px + env(safe-area-inset-bottom,0px));
    text-align:center;
    z-index:7;
    background:linear-gradient(180deg, rgba(8,3,18,0) 0%, rgba(8,3,18,.95) 40%, #080312 100%);
    opacity:0;
    transform:translateY(30px);
    transition:opacity 1.2s ease, transform 1.2s ease;
    pointer-events:none;
  }
  #blessing.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  #blessing .to{
    font-size:15px;
    letter-spacing:.1em;
    color:var(--gold);
    margin:0 0 12px;
  }
  #blessing p{
    margin:0;
    font-size:17px;
    line-height:2.2;
    font-weight:500;
    color:#FFF;
  }
  #blessing .sign{
    margin-top:20px;
    font-size:13px;
    letter-spacing:.3em;
    color:rgba(255,255,255,0.5);
  }

  @media (prefers-reduced-motion: reduce){
    .star, .petal{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="scene">
  <div id="starLayer"></div>

  <div class="header">
    <p class="eyebrow">MID-AUTUMN FESTIVAL</p>
    <h1>中秋佳節・花好月圓</h1>
  </div>

  <div class="moon-stage">
    <canvas id="moonCanvas" width="400" height="400"></canvas>
    <canvas id="cloudCanvas" width="400" height="400"></canvas>
  </div>

  <div id="petalLayer"></div>

  <p class="hint" id="hint">▸ 輕輕抹去雲層，賞一輪明月</p>

  <div id="blessing">
    <p class="to" id="blessingTo">致 合作夥伴</p>
    <p>花好月圓人團圓，<br>感謝這一年您與我們像圓月一樣完美的合作。</p>
    <p class="sign">中秋節快樂</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============ 個人化稱呼 ============ */
  var params = new URLSearchParams(window.location.search);
  var clientName = (params.get('name') || '').trim();
  document.getElementById('blessingTo').textContent =
    '致 ' + (clientName ? clientName : '合作夥伴');

  /* ============ 繁星點點 ============ */
  var starLayer = document.getElementById('starLayer');
  var starFrag = document.createDocumentFragment();
  for (var i = 0; i < 80; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 80) + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    // 讓星星大小有錯落感
    if(Math.random() > 0.8) s.style.transform = 'scale(1.5)';
    starFrag.appendChild(s);
  }
  starLayer.appendChild(starFrag);

  /* ============ 桂花飄落 ============ */
  var petalLayer = document.getElementById('petalLayer');
  var petalRate = 1; 
  function spawnPetal(){
    var p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + '%';
    var duration = (6 + Math.random() * 5) / petalRate;
    var size = 4 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
    p.style.animationDuration = duration + 's';
    p.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
    petalLayer.appendChild(p);
    setTimeout(function(){ p.remove(); }, duration * 1000 + 200);
  }
  setInterval(function(){
    spawnPetal();
    if (petalRate > 1.5) spawnPetal(); 
  }, 350);

  /* ============ 畫布設定 ============ */
  var moonCanvas = document.getElementById('moonCanvas');
  var cloudCanvas = document.getElementById('cloudCanvas');
  var mctx = moonCanvas.getContext('2d');
  var cctx = cloudCanvas.getContext('2d');
  var W = moonCanvas.width, H = moonCanvas.height;
  var cx = W / 2, cy = H / 2, r = W * 0.35; // 月亮本體半徑

  var PHASES = [0, 0.25, 0.5, 0.75, 1]; // 0=新月, 1=滿月
  var phaseIndex = 0; 
  var locked = false;
  var revealed = false;

  /* ============ 渲染寫實月亮 ============ */
  function drawMoon(t){
    mctx.clearRect(0, 0, W, H);

    // 1. 月暈 (外圍發光)
    mctx.save();
    var glow = mctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*1.6);
    // 亮度隨月相變化
    var glowAlpha = 0.1 + 0.4 * t;
    glow.addColorStop(0, 'rgba(255, 240, 180, ' + glowAlpha + ')');
    glow.addColorStop(1, 'rgba(255, 240, 180, 0)');
    mctx.fillStyle = glow;
    mctx.fillRect(0, 0, W, H);
    mctx.restore();

    // 2. 繪製月亮本體與表面紋理
    mctx.save();
    mctx.beginPath();
    mctx.arc(cx, cy, r, 0, Math.PI * 2);
    mctx.clip();

    // 底色：溫暖的黃色漸層
    var base = mctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    base.addColorStop(0, '#FFFFEE');
    base.addColorStop(0.6, '#F8D98C');
    base.addColorStop(1, '#C8902A');
    mctx.fillStyle = base;
    mctx.fillRect(0, 0, W, H);

    // 月海 (隕石坑紋理)：利用多個半透明模糊圓形疊加
    mctx.filter = 'blur(6px)';
    mctx.fillStyle = 'rgba(120, 80, 40, 0.15)';
    var craters = [
      [0.2, -0.3, 0.4], [-0.3, -0.15, 0.35], [-0.1, 0.4, 0.3],
      [0.35, 0.25, 0.25], [-0.4, 0.3, 0.2], [0.4, -0.1, 0.2]
    ];
    craters.forEach(function(c){
      mctx.beginPath();
      mctx.arc(cx + c[0]*r, cy + c[1]*r, c[2]*r, 0, Math.PI*2);
      mctx.fill();
    });
    mctx.filter = 'none';
    mctx.restore();

    // 3. 陰影 (控制月相)
    if(t < 1) {
      mctx.save();
      var offset = r * (1 - 2 * t) * 1.05;
      mctx.globalCompositeOperation = 'destination-out';
      mctx.beginPath();
      mctx.arc(cx + offset, cy, r * 1.02, 0, Math.PI * 2);
      mctx.filter = 'blur(4px)'; // 讓明暗交界處有柔和的過渡
      mctx.fillStyle = 'black';
      mctx.fill();
      mctx.restore();
    }
  }

  /* ============ 生成體積光雲層 ============ */
  var LOW = 48;
  var lowCanvas = document.createElement('canvas');
  lowCanvas.width = LOW; lowCanvas.height = LOW;
  var lowCtx = lowCanvas.getContext('2d');
  var baselineAlpha = 0;
  var needsCheck = false;

  function syncLowRes(){
    lowCtx.clearRect(0, 0, LOW, LOW);
    lowCtx.drawImage(cloudCanvas, 0, 0, LOW, LOW);
  }
  function sumAlpha(){
    var d = lowCtx.getImageData(0, 0, LOW, LOW).data;
    var sum = 0;
    for (var i = 3; i < d.length; i += 4) sum += d[i];
    return sum;
  }

  function drawClouds(){
    cctx.clearRect(0, 0, W, H);
    // 高斯模糊讓雲團融合得更寫實
    cctx.filter = 'blur(16px)';

    // 產生 100 個雲團，距離中心越近的越亮，邊緣則呈現深紫藍色
    var puffs = [];
    for(var i = 0; i < 100; i++){
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * (W * 0.45); // 分布在畫布內
      var x = cx + Math.cos(angle) * dist;
      var y = cy + Math.sin(angle) * dist * 0.8; 
      var radius = W * (0.15 + Math.random() * 0.2);
      puffs.push({ x: x, y: y, r: radius, d: Math.hypot(x-cx, y-cy) });
    }

    // 將雲團依距離由遠到近排序，讓靠近月亮的亮雲蓋在上面
    puffs.sort(function(a, b){ return b.d - a.d; });

    puffs.forEach(function(p){
      // 根據距離月亮中心的遠近，決定雲的亮度 (體積光效果)
      var intensity = Math.max(0, 1 - (p.d / (W * 0.45)));
      
      // 邊緣是深紫黑 (30,20,45) -> 靠近中心透出月光黃 (220,180,100)
      var cr = Math.floor(30 + intensity * 190);
      var cg = Math.floor(20 + intensity * 160);
      var cb = Math.floor(45 + intensity * 55);
      var ca = 0.85 + Math.random() * 0.15;

      var grad = cctx.createRadialGradient(p.x, p.y, p.r*0.1, p.x, p.y, p.r);
      grad.addColorStop(0, 'rgba('+cr+','+cg+','+cb+','+ca+')');
      grad.addColorStop(1, 'rgba('+cr+','+cg+','+cb+',0)');

      cctx.fillStyle = grad;
      cctx.beginPath();
      cctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      cctx.fill();
    });

    cctx.filter = 'none';
  }
  
  // 初始化渲染
  drawMoon(PHASES[phaseIndex]);
  drawClouds();
  syncLowRes();
  baselineAlpha = sumAlpha();

  /* ============ 雲層擦除互動 ============ */
  function getPos(evt){
    var rect = cloudCanvas.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (clientX - rect.left) / rect.width * W,
      y: (clientY - rect.top) / rect.height * H
    };
  }

  var erasing = false;
  var lastPos = null;
  var BRUSH = W * 0.18; // 調整筆刷大小讓手感更好

  function eraseDot(x, y){
    cctx.globalCompositeOperation = 'destination-out';
    // 使用柔和漸層筆刷，擦起來才像「撥開霧氣」而不是「挖破洞」
    var grad = cctx.createRadialGradient(x, y, 0, x, y, BRUSH);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0.7)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    cctx.fillStyle = grad;
    cctx.beginPath();
    cctx.arc(x, y, BRUSH, 0, Math.PI * 2);
    cctx.fill();
    cctx.globalCompositeOperation = 'source-over';
  }
  
  function eraseAt(pos){
    if (lastPos){
      var dx = pos.x - lastPos.x, dy = pos.y - lastPos.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var step = BRUSH * 0.15; // 密集補點，避免滑動過快產生斷層
      var n = Math.min(Math.ceil(dist / step), 50);
      for (var i = 1; i <= n; i++){
        eraseDot(lastPos.x + dx * i / n, lastPos.y + dy * i / n);
      }
    } else {
      eraseDot(pos.x, pos.y);
    }
    lastPos = pos;
    needsCheck = true;
  }

  function checkErasedRatio(){
    if (revealed) return;
    syncLowRes();
    var remain = sumAlpha();
    var erasedRatio = 1 - (remain / baselineAlpha);
    // 只要抹掉大約 40% 的雲，剩下的雲就會自動散開
    if (erasedRatio > 0.4){
      revealed = true;
      fadeOutClouds();
    }
  }

  (function loop(){
    if (needsCheck){
      needsCheck = false;
      checkErasedRatio();
    }
    requestAnimationFrame(loop);
  })();

  function fadeOutClouds(){
    var start = null;
    function step(ts){
      if (!start) start = ts;
      var p = Math.min((ts - start) / 1000, 1);
      cctx.save();
      cctx.globalCompositeOperation = 'destination-out';
      cctx.fillStyle = 'rgba(0,0,0,0.06)';
      cctx.fillRect(0,0,W,H);
      cctx.restore();
      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        cctx.clearRect(0,0,W,H);
        cloudCanvas.style.pointerEvents = 'none';
        var hint = document.getElementById('hint');
        hint.textContent = '▸ 點擊月亮，願花好月圓';
        hint.classList.remove('hide');
      }
    }
    requestAnimationFrame(step);
  }

  // 綁定滑鼠與觸控事件
  function onDown(e){
    if (revealed) return;
    erasing = true;
    lastPos = null;
    if (cloudCanvas.setPointerCapture && e.pointerId != null){
      try { cloudCanvas.setPointerCapture(e.pointerId); } catch(err){}
    }
    eraseAt(getPos(e));
    e.preventDefault();
  }
  function onMove(e){
    if (!erasing || revealed) return;
    eraseAt(getPos(e));
    e.preventDefault();
  }
  function onUp(e){
    erasing = false;
    lastPos = null;
  }

  if (window.PointerEvent){
    cloudCanvas.addEventListener('pointerdown', onDown);
    cloudCanvas.addEventListener('pointermove', onMove);
    cloudCanvas.addEventListener('pointerup', onUp);
    cloudCanvas.addEventListener('pointercancel', onUp);
  } else {
    cloudCanvas.addEventListener('touchstart', onDown, {passive:false});
    cloudCanvas.addEventListener('touchmove', onMove, {passive:false});
    cloudCanvas.addEventListener('touchend', onUp);
    cloudCanvas.addEventListener('mousedown', onDown);
    cloudCanvas.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  /* ============ 點擊月相與結尾動畫 ============ */
  var hintEl = document.getElementById('hint');
  
  function onMoonTap(){
    if (!revealed || locked) return;
    phaseIndex++;
    if (phaseIndex >= PHASES.length - 1){
      phaseIndex = PHASES.length - 1;
      locked = true;
      drawMoon(PHASES[phaseIndex]);
      celebrate();
      return;
    }
    drawMoon(PHASES[phaseIndex]);
  }

  moonCanvas.addEventListener('click', onMoonTap);
  moonCanvas.addEventListener('touchend', function(e){
    e.preventDefault();
    onMoonTap();
  }, {passive:false});

  function celebrate(){
    petalRate = 2.5; // 滿月時桂花雨加速
    hintEl.classList.add('hide');
    setTimeout(function(){
      document.getElementById('blessing').classList.add('show');
    }, 600);
    // 幾秒後花瓣速度恢復正常
    setTimeout(function(){ petalRate = 1; }, 6000);
  }

})();
</script>
</body>
</html>
