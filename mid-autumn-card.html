<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>中秋佳節・花好月圓</title>
<!-- 引入優雅的襯線字體 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #090514;
    --bg-light: #1A1035;
    --gold-light: #FDE68A;
    --gold-main: #FCD34D;
    --gold-dark: #D97706;
    --text-white: #FDFBF7;
    --text-gray: #D1D5DB;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: 'Noto Serif TC', serif;
    color: var(--text-white);
  }

  /* ---------- 深邃星空背景 ---------- */
  #scene {
    position: relative;
    width: 100%; height: 100vh; height: 100dvh;
    background: radial-gradient(circle at 50% 45%, var(--bg-light) 0%, var(--bg-dark) 80%);
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #FFF;
    border-radius: 50%;
    opacity: 0;
    animation: starTwinkle var(--twinkle-dur) ease-in-out infinite var(--twinkle-del);
  }

  @keyframes starTwinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.5); box-shadow: none; }
    50% { opacity: 0.8; transform: scale(1); box-shadow: 0 0 6px rgba(255,255,255,0.8); }
  }

  /* ---------- 頂部優雅標題 ---------- */
  .header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(48px + env(safe-area-inset-top,0px)) 24px 0;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: translateY(15px);
    animation: fadeInLift 3s ease-out 2s forwards;
  }
  .header .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.35em;
    color: var(--gold-main);
    margin: 0 0 14px 0;
    opacity: 0.9;
  }
  .header h1 {
    margin: 0;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: 0.25em;
    color: var(--text-white);
    text-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }

  /* ---------- 質感明月 ---------- */
  .moon-stage {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(60vw, 260px);
    aspect-ratio: 1;
    z-index: 2;
    opacity: 0;
    animation: moonReveal 3s ease-out 0.5s forwards;
  }
  .moon {
    width: 100%; height: 100%;
    border-radius: 50%;
    /* 溫潤的立體球體漸層 */
    background: radial-gradient(circle at 35% 35%, #FFFDF0 0%, #FEF3C7 25%, #FCD34D 70%, #D97706 100%);
    box-shadow:
      0 0 40px 10px rgba(252, 211, 77, 0.4),
      0 0 100px 30px rgba(217, 119, 6, 0.2),
      inset -16px -16px 32px rgba(146, 64, 14, 0.5),
      inset 8px 8px 16px rgba(255, 255, 255, 0.8);
  }

  /* ---------- 柔和霧氣雲層 (保證散開露出月亮) ---------- */
  .cloud-gate {
    position: absolute; top: 0; height: 100vh;
    z-index: 5;
    pointer-events: none;
  }
  /* 左側雲門 */
  .cloud-left {
    left: 0; width: 50vw;
    animation: slideLeft 4.5s cubic-bezier(0.3, 0.9, 0.4, 1) 1s forwards;
  }
  /* 右側雲門 */
  .cloud-right {
    right: 0; width: 50vw;
    animation: slideRight 4.5s cubic-bezier(0.3, 0.9, 0.4, 1) 1s forwards;
  }

  /* 確保雲層能向兩側完全退開，離開畫面中心 */
  @keyframes slideLeft { 100% { transform: translateX(-65vw); opacity: 0.5; } }
  @keyframes slideRight { 100% { transform: translateX(65vw); opacity: 0.5; } }

  /* 雲層的上下輕微呼吸漂浮 (與開門動畫分離，避免跳格) */
  .cloud-float {
    position: absolute; width: 100%; height: 100%;
    animation: breath 8s ease-in-out infinite alternate;
  }

  @keyframes breath {
    0% { transform: translateY(-10px); }
    100% { transform: translateY(15px); }
  }

  /* 畫出雲朵的柔和圓團 */
  .puff {
    position: absolute;
    background: radial-gradient(circle, #251842 0%, #150B26 60%, transparent 100%);
    filter: blur(24px); /* 大量羽化邊緣，形成真實霧氣 */
    border-radius: 50%;
  }
  /* 雲朵邊緣透出的微弱月光 */
  .lit-left { box-shadow: 20px -10px 50px rgba(252, 211, 77, 0.15); }
  .lit-right { box-shadow: -20px -10px 50px rgba(252, 211, 77, 0.15); }

  /* 佈置左右雲團的相對位置 */
  .cloud-left .puff:nth-child(1) { width: 60vh; height: 60vh; top: 20%; right: -25vh; }
  .cloud-left .puff:nth-child(2) { width: 45vh; height: 45vh; top: -10%; right: 10vh; }
  .cloud-left .puff:nth-child(3) { width: 50vh; height: 50vh; bottom: 0; right: -15vh; }
  
  .cloud-right .puff:nth-child(1) { width: 65vh; height: 65vh; top: 25%; left: -30vh; }
  .cloud-right .puff:nth-child(2) { width: 40vh; height: 40vh; top: -5%; left: 5vh; }
  .cloud-right .puff:nth-child(3) { width: 55vh; height: 55vh; bottom: -10%; left: -20vh; }


  /* ---------- 底部精緻祝福卡 ---------- */
  .blessing {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 60px 32px calc(48px + env(safe-area-inset-bottom,0px));
    text-align: center;
    z-index: 10;
    background: linear-gradient(180deg, rgba(9,5,20,0) 0%, rgba(9,5,20,0.85) 40%, #090514 100%);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInLift 3s ease-out 3s forwards; /* 延遲 3 秒，等月亮出來後浮現 */
  }
  
  .blessing .to {
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.2em;
    color: var(--gold-main);
    margin-bottom: 18px;
  }
  .blessing p {
    margin: 0;
    font-weight: 300;
    font-size: 16px;
    line-height: 2.2;
    letter-spacing: 0.1em;
    color: var(--text-white);
  }
  .blessing .sign {
    margin-top: 28px;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.4em;
    color: var(--text-gray);
    opacity: 0.7;
  }

  /* ---------- 落桂花 ---------- */
  #petalLayer {
    position: absolute; inset: 0;
    z-index: 8;
    pointer-events: none;
  }
  .petal {
    position: absolute; top: -10px;
    background: var(--gold-main);
    border-radius: 2px 8px 2px 8px;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(252, 211, 77, 0.6);
    animation: fall linear forwards;
  }

  /* ---------- 動畫 Keyframes ---------- */
  @keyframes fadeInLift {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes moonReveal {
    0% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes fall {
    0% { transform: translateY(-5vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(var(--drift)) rotate(320deg); }
  }
</style>
</head>
<body>

<div id="scene">
  <!-- 繁星點點 -->
  <div id="starLayer"></div>

  <!-- 頂部標題 -->
  <div class="header">
    <p class="eyebrow">MID-AUTUMN FESTIVAL</p>
    <h1>中秋佳節・花好月圓</h1>
  </div>

  <!-- 明月 -->
  <div class="moon-stage">
    <div class="moon"></div>
  </div>

  <!-- 雲層 -->
  <div class="cloud-gate cloud-left">
    <div class="cloud-float">
      <!-- 圓團透過高斯模糊結合成柔和霧氣 -->
      <div class="puff lit-left"></div>
      <div class="puff lit-left"></div>
      <div class="puff"></div>
    </div>
  </div>
  <div class="cloud-gate cloud-right">
    <div class="cloud-float" style="animation-delay: -3s;"> <!-- 左右漂浮頻率錯開 -->
      <div class="puff lit-right"></div>
      <div class="puff lit-right"></div>
      <div class="puff"></div>
    </div>
  </div>

  <!-- 落花層 -->
  <div id="petalLayer"></div>

  <!-- 祝福文案 -->
  <div class="blessing">
    <div class="to" id="blessingTo">致 合作夥伴</div>
    <p>花好月圓人團圓，<br>感謝這一年您與我們像圓月一樣完美的合作。</p>
    <div class="sign">中秋節快樂</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // --- 解析網址參數作為稱呼 (?name=客戶名稱) ---
  const params = new URLSearchParams(window.location.search);
  const clientName = (params.get('name') || '').trim();
  document.getElementById('blessingTo').textContent = 
    '致 ' + (clientName ? clientName : '合作夥伴');

  // --- 生成星空 ---
  const starLayer = document.getElementById('starLayer');
  const starFrag = document.createDocumentFragment();
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 80 + '%';
    // CSS 變數控制各自的閃爍節奏
    s.style.setProperty('--twinkle-del', (Math.random() * 5) + 's');
    s.style.setProperty('--twinkle-dur', (3 + Math.random() * 4) + 's');
    starFrag.appendChild(s);
  }
  starLayer.appendChild(starFrag);

  // --- 動態生成桂花 ---
  const petalLayer = document.getElementById('petalLayer');
  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (10 + Math.random() * 80) + '%';
    
    const size = 4 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    
    const duration = 7 + Math.random() * 5;
    p.style.animationDuration = duration + 's';
    p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
    
    petalLayer.appendChild(p);
    
    // 落地後清除 DOM
    setTimeout(() => { p.remove(); }, duration * 1000);
  }

  // 等待雲層撥開後（延遲 1.5 秒），開始緩慢飄落桂花
  setTimeout(() => {
    setInterval(spawnPetal, 500);
  }, 1500);

})();
</script>

</body>
</html>
